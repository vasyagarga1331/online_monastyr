<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Онлайн-монастырь · Ново-Нямецкий</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Philosopher:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F5;--paper:#fff;--ink:#1F2433;--mut:#5F6678;--line:#D5DBE6;--blue:#27438F;--gold:#B98A1F;--goldsoft:#F6E7B8;--red:#B53A2C;--lawn:#DCE7D6;--path:#EADFC4;--bld:#FBF6E9;--wall:#9C8660;--on:#fff;--accent:var(--blue);--card:var(--paper);--sel:var(--goldsoft);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1524;--paper:#182034;--ink:#E8ECF6;--mut:#9AA3BA;--line:#2A3452;--blue:#8FA8F0;--gold:#E0B44A;--goldsoft:#4A3C16;--red:#E58270;--lawn:#17261F;--path:#3A3A2C;--bld:#26304B;--wall:#7C8CB0;--on:#0F1524;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1524;--paper:#182034;--ink:#E8ECF6;--mut:#9AA3BA;--line:#2A3452;--blue:#8FA8F0;--gold:#E0B44A;--goldsoft:#4A3C16;--red:#E58270;--lawn:#17261F;--path:#3A3A2C;--bld:#26304B;--wall:#7C8CB0;--on:#0F1524;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0px) 0 calc(88px + env(safe-area-inset-bottom,0px))}
main{max-width:620px;margin:0 auto;padding:16px 14px}
h1,h2,.hi{font-family:Philosopher,Georgia,"Times New Roman",serif;font-weight:700;margin:0}
h1{font-size:30px;line-height:1.15}h2{font-size:20px;margin-bottom:8px}.hi{font-size:22px;line-height:1.2;margin-bottom:4px}
.hero{text-align:center;padding:24px 8px 12px}.mark{font-size:46px;line-height:1;color:var(--gold)}
.hero p{color:var(--mut);margin:8px auto 0;max-width:34ch}
.panel{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:20px;padding:18px;margin:14px 0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.note{background:var(--goldsoft);border:1px solid var(--gold)}
label,.lbl{display:block;font-weight:700;font-size:14px}
input,textarea{width:100%;padding:12px 14px;margin:6px 0 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-weight:400}
textarea{min-height:160px;resize:vertical}
select{padding:9px 12px;margin:4px 0;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button{font:inherit;font-weight:700;padding:10px 16px;border-radius:999px;border:1.5px solid var(--blue);background:var(--blue);color:var(--on);cursor:pointer;transition:transform .08s}
button:active{transform:scale(.97)}
button.ghost{background:transparent;color:var(--blue)}
button.big{width:100%;padding:14px;font-size:17px}
button.sm{padding:6px 14px;font-size:14px}
.seg{display:flex;gap:4px;background:var(--bg);border-radius:999px;padding:4px;margin:6px 0 14px}
.seg button{flex:1;background:transparent;color:var(--mut);border:0}
.seg button.on{background:var(--paper);color:var(--blue);box-shadow:0 1px 3px rgba(20,30,60,.2)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row input{flex:1;min-width:0;margin:0}
.mut{color:var(--mut);font-size:14px}.hint{text-align:center;margin:12px 0 0}
.err{color:var(--red);min-height:22px;font-size:14px;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.pill{display:inline-block;padding:2px 12px;border-radius:99px;background:var(--goldsoft);font-size:14px;font-weight:600}
.ann{background:var(--goldsoft);border:1px solid var(--gold);border-radius:14px;padding:10px 14px;margin:10px 0}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px;background:#9AA0AD}
.dot.on{background:#2FA05A;box-shadow:0 0 0 3px rgba(47,160,90,.25)}
svg{width:100%;height:auto;display:block;border-radius:18px;border:2px solid var(--gold);background:var(--lawn)}
.b{cursor:pointer}.b rect{fill:var(--bld);stroke:var(--wall);stroke-width:1.5}
.b.sel rect{fill:var(--goldsoft);stroke:var(--gold);stroke-width:3}.b text{fill:var(--ink);font-family:Nunito,sans-serif;font-weight:700}
#chips{display:flex;gap:8px;overflow-x:auto;margin:12px -14px;padding:2px 14px 6px}
#chips button{white-space:nowrap;padding:8px 14px}
.role{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.role:first-of-type{border-top:0}
.u{padding:12px 0;border-top:1px solid var(--line)}.u:first-of-type{border-top:0}
.cell{white-space:pre-wrap;margin:10px 0;padding:12px 14px;background:var(--bg);border-radius:12px;border-left:3px solid var(--gold)}
summary{cursor:pointer;font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;gap:2px;background:var(--paper);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
nav button{flex:1;max-width:112px;background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;font-size:12px;padding:4px 2px;border-radius:14px;position:relative}
nav button.on{color:var(--blue);background:var(--goldsoft)}
nav .ic{font-size:22px;line-height:1.25}
nav .bd{position:absolute;top:0;right:14%;background:var(--red);color:#fff;font-style:normal;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px}
#toast{position:fixed;left:14px;right:14px;top:calc(env(safe-area-inset-top,0px) + 10px);max-width:592px;margin:auto;z-index:30;box-shadow:0 8px 24px rgba(10,20,50,.28)}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<main>
<section id="auth">
  <div class="hero">
    <div class="mark">☦</div>
    <h1>Онлайн-монастырь</h1>
    <p>Ново-Нямецкий монастырь, где собираются братия и сёстры. Мир вам, заходите.</p>
  </div>
  <div class="panel">
    <div class="seg" id="mseg"><button data-m="in" class="on">Вход</button><button data-m="reg">Регистрация</button></div>
    <label>Логин<input id="l" placeholder="3–16 знаков, без пробелов" autocomplete="username" maxlength="16"></label>
    <label>Пароль<input id="p" type="password" placeholder="От 4 знаков" autocomplete="current-password" maxlength="64"></label>
    <div id="regf" class="hide">
      <label>Имярек<input id="n" placeholder="Имя, которое увидят в обители" maxlength="24"></label>
      <div class="lbl">Кто вы?</div>
      <div class="seg" id="gseg"><button data-g="m" class="on">Монах</button><button data-g="f">Монахиня</button></div>
    </div>
    <div class="err" id="err"></div>
    <button class="big" id="go">Войти в обитель</button>
    <p class="mut hint" id="hint">Нет аккаунта? Откройте вкладку «Регистрация».</p>
  </div>
</section>

<section id="game" class="hide">
  <header class="top">
    <div><div class="hi" id="hi"></div><span class="pill" id="rolen"></span></div>
    <button class="ghost sm" id="out">Выйти</button>
  </header>
  <div class="ann hide" id="ann"></div>
  <div id="t-map">
    <svg id="map" viewBox="0 0 400 440" role="img" aria-label="Карта монастыря"></svg>
    <div id="chips"></div>
    <div class="card" id="panel"></div>
  </div>
  <div id="t-cells" class="hide"></div>
  <div id="t-bro" class="hide"></div>
  <div id="t-inbox" class="hide"></div>
  <div id="t-adm" class="hide"></div>
  <details class="card"><summary>Сменить пароль</summary>
    <input id="npw" type="password" placeholder="Новый пароль (от 4 знаков)" maxlength="64" autocomplete="new-password" style="margin-top:12px">
    <div class="row"><button class="ghost sm" id="npb">Сменить пароль</button><span class="mut" id="npm"></span></div>
  </details>
</section>
</main>
<nav id="nav" class="hide"></nav>
<div id="toast" class="card note hide"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL="https://gsszvglmnagacvipvrjg.supabase.co";
const SUPABASE_KEY="sb_publishable_xTsVoOcMo5A_KpYIhFZ7fw_xul5uywa";
const DOMAIN="gmail.com"; // служебный домен для скрытой почты; письма не отправляются
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// Чины: [мужская форма, женская форма]. Раздаёт только архиепископ.
const ROLES={novice:["Послушник","Послушница"],monk:["Монах","Монахиня"],lib:["Библиотекарь"],bell:["Звонарь"],cook:["Трапезник","Трапезница"],icon:["Иконописец"],regent:["Регент"],treas:["Казначей"],arch:["Архиепископ (Игумен)"]};
const rn=p=>{const r=ROLES[p.role]||ROLES.novice;return(p.gender==="f"&&r[1])||r[0]};
const B=[
 {id:"cath",x:150,y:130,w:100,h:70,e:"⛪",s:"Собор",n:"Вознесенский собор",d:"Главный храм обители. Здесь совершаются службы."},
 {id:"bell",x:290,y:90,w:80,h:60,e:"🔔",s:"Колокольня",n:"Колокольня",d:"Колокольный звон созывает братию на молитву."},
 {id:"lib",x:30,y:80,w:90,h:60,e:"📜",s:"Библиотека",n:"Библиотека",d:"Рукописи и книги обители."},
 {id:"ref",x:30,y:210,w:90,h:60,e:"🍞",s:"Трапезная",n:"Трапезная",d:"Общая трапеза после службы."},
 {id:"cells",x:30,y:330,w:90,h:60,e:"🏠",s:"Кельи",n:"Кельи",d:"Братский корпус: у каждого насельника своя келья."},
 {id:"studio",x:280,y:210,w:90,h:60,e:"🎨",s:"Мастерская",n:"Иконная мастерская",d:"Здесь пишут иконы."},
 {id:"abbot",x:150,y:240,w:100,h:60,e:"🏛",s:"Настоятельская",n:"Настоятельский корпус",d:"Покои настоятеля и совет братии."},
 {id:"garden",x:280,y:330,w:90,h:60,e:"🌳",s:"Сад",n:"Сад и источник",d:"Тишина, вода и труд на земле."},
 {id:"gate",x:150,y:350,w:100,h:50,e:"🚪",s:"Врата",n:"Святые врата",d:"Вход в обитель. Выберите место на карте или в списке ниже."}
];
const bid=id=>B.find(b=>b.id===id)||B[8];
const TABS=[["map","🗺","Карта"],["cells","🏠","Кельи"],["bro","👥","Братия"],["inbox","✉️","Письма"],["adm","🛡","Админ"]];
let authMode="in",gsel="m",sb=null,me=null,all=[],ann="",notes=[],seen=0,tab="map",viewId=null,lastCall={},timers=[];

const mail=k=>"m"+[...new TextEncoder().encode(k)].map(x=>x.toString(16).padStart(2,"0")).join("")+"@"+DOMAIN;
const PW=p=>p+"!obitel";
const msg=t=>$("#err").textContent=t;
const dot=p=>`<span class="dot${p.online?" on":""}"></span>`;
const nm=id=>{const p=all.find(x=>x.id===id);return p?p.name:"Кто-то"};
const ntext=n=>n.kind==="call"?`🔔 ${nm(n.from_id)} ждёт вас в вашей келье`:n.kind==="task"?`📜 Вам назначено послушание: ${n.body}`:`✉ ${nm(n.from_id)}: ${n.body}`;
const sorted=()=>[...all].sort((a,b)=>(b.is_admin-a.is_admin)||(b.online-a.online)||a.name.localeCompare(b.name,"ru"));
const fmt=t=>new Date(t).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});

function creds(){
 let l=$("#l").value.trim(),p=$("#p").value,k=l.toLowerCase();
 if(k==="admin"){k="админ";l="админ"}
 if(k==="админ"&&p.toLowerCase()==="admin")p="админ";
 const n=$("#n").value.trim()||(k==="админ"?"Дмитрий":"");
 return{l,k,p,n,g:gsel};
}
async function reg(){
 const{l,k,p,n,g}=creds();
 if(!/^\S{3,16}$/.test(l)||p.length<4)return msg("Логин 3–16 знаков без пробелов, пароль от 4.");
 if(n.length<2)return msg("Впишите Имярек: имя, которое будет видно в игре.");
 msg("Подождите…");
 const{data,error}=await sb.auth.signUp({email:mail(k),password:PW(p)});
 if(error)return msg(/registered|exists/i.test(error.message)?"Такой логин уже занят.":"Ошибка: "+error.message);
 if(!data.session)return msg("В Supabase нужно отключить Confirm email.");
 await boot(data.user,{k,n,g});
}
async function login(){
 const{l,k,p,n,g}=creds();
 if(!l||!p)return msg("Введите логин и пароль.");
 msg("Подождите…");
 const{data,error}=await sb.auth.signInWithPassword({email:mail(k),password:PW(p)});
 if(error)return msg("Неверный логин или пароль.");
 await boot(data.user,{k,n:n||l,g});
}
async function boot(user,c){
 await loadAll();
 me=all.find(x=>x.id===user.id);
 if(!me&&c){
  const{error}=await sb.from("profiles").insert({id:user.id,login:c.k,name:c.n,gender:c.g});
  if(error)return msg("Ошибка: "+error.message);
  await loadAll();me=all.find(x=>x.id===user.id);
 }
 if(!me)return leave("Профиль не найден. Войдите заново.");
 await sb.rpc("touch");
 await loadNotes(false);
 msg("");$("#p").value="";
 $("#auth").classList.add("hide");$("#game").classList.remove("hide");$("#nav").classList.remove("hide");
 setTab("map");
 const un=notes.filter(n=>!n.read).length;if(un)toast("Непрочитанных писем: "+un);
 timers.forEach(clearInterval);
 timers=[setInterval(tick,10000),setInterval(()=>sb.rpc("touch"),60000)];
}
async function leave(m){
 timers.forEach(clearInterval);timers=[];
 try{await sb.auth.signOut()}catch(e){}
 me=null;$("#game").classList.add("hide");$("#nav").classList.add("hide");$("#auth").classList.remove("hide");msg(m||"");
}
async function loadAll(){
 const r=await sb.from("roster").select("*");
 all=r.data||[];
 const pr=await sb.from("profiles").select("id,task,task_done");
 const tm={};(pr.data||[]).forEach(x=>tm[x.id]=x);
 all.forEach(p=>Object.assign(p,tm[p.id]||{task:"",task_done:false}));
 if(me){const m=all.find(x=>x.id===me.id);if(m)me=m}
 const a=await sb.from("settings").select("v").eq("k","ann").maybeSingle();
 ann=a.data?a.data.v:"";
}
async function loadNotes(notify){
 const r=await sb.from("notes").select("*").eq("to_id",me.id).order("id",{ascending:false}).limit(30);
 notes=r.data||[];
 const fresh=notes.filter(n=>n.id>seen&&!n.read);
 if(notify&&fresh.length){
  const t=ntext(fresh[0]);toast(t);
  if("Notification"in window&&Notification.permission==="granted")try{new Notification("Онлайн-монастырь",{body:t})}catch(e){}
 }
 seen=Math.max(seen,0,...notes.map(n=>n.id));
}
async function tick(){
 if(!me)return;
 const id=me.id;await loadAll();
 if(!all.some(x=>x.id===id))return leave("Профиль не найден. Войдите заново.");
 await loadNotes(true);render(true);
}
async function upd(p,patch){
 const{error}=await sb.from("profiles").update(patch).eq("id",p.id);
 if(!error)Object.assign(p,patch);
 return!error;
}
function toast(t){
 const el=$("#toast");el.innerHTML=esc(t)+' <button id="tb">Открыть</button>';el.classList.remove("hide");
 clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.add("hide"),9000);
}
$("#toast").addEventListener("click",e=>{if(e.target.id==="tb"){$("#toast").classList.add("hide");setTab("inbox")}});

function setTab(k){
 tab=k;if(k!=="cells")viewId=null;
 for(const[t]of TABS)$("#t-"+t).classList.toggle("hide",t!==k);
 render();window.scrollTo(0,0);
}
$("#nav").addEventListener("click",e=>{const b=e.target.closest("[data-t]");if(b)setTab(b.dataset.t)});

function render(soft){
 if(!me)return;
 $("#hi").textContent="Мир вам, "+me.name+"!";$("#rolen").textContent=rn(me);
 $("#ann").textContent=ann?"📣 "+ann:"";$("#ann").classList.toggle("hide",!ann);
 const un=notes.filter(n=>!n.read).length;
 $("#nav").innerHTML=TABS.filter(t=>t[0]!=="adm"||me.is_admin).map(([k,e,n])=>`<button data-t="${k}" class="${tab===k?"on":""}"><span class="ic">${e}</span>${n}${k==="inbox"&&un?`<i class="bd">${un}</i>`:""}</button>`).join("");
 if(tab==="map")rMap();
 if(tab==="cells"&&!(soft&&viewId===me.id))rCells();
 if(tab==="bro")rBro();
 if(tab==="inbox")rInbox();
 if(tab==="adm"&&!soft)rAdm();
}

// ---------- Карта ----------
function rMap(){
 let s='<rect x="10" y="10" width="380" height="420" rx="16" fill="var(--lawn)" stroke="var(--wall)" stroke-width="3"/><path d="M200 400V60M120 112H290M120 240H280M120 360H280" stroke="var(--path)" stroke-width="12" stroke-linecap="round" fill="none"/>';
 for(const b of B)s+=`<g class="b${me.pos===b.id?" sel":""}" data-b="${b.id}"><rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="8"/><text x="${b.x+b.w/2}" y="${b.y+b.h/2}" font-size="24" text-anchor="middle">${b.e}</text><text x="${b.x+b.w/2}" y="${b.y+b.h-8}" font-size="10" text-anchor="middle">${b.n}</text></g>`;
 for(const b of B){
  all.filter(p=>p.pos===b.id&&(p.online||p.id===me.id)).sort((a,c)=>(c.id===me.id)-(a.id===me.id)).slice(0,6).forEach((p,i)=>{
   const cx=b.x+10+i*15;
   s+=`<g pointer-events="none"><circle cx="${cx}" cy="${b.y}" r="7.5" style="fill:${p.id===me.id?"var(--accent)":"var(--wall)"}"/><text x="${cx}" y="${b.y+3.5}" font-size="9" text-anchor="middle" style="fill:var(--on)">${esc((p.name[0]||"?").toUpperCase())}</text></g>`;
  });
 }
 $("#map").innerHTML=s;
 $("#chips").innerHTML=B.map(b=>`<button data-b="${b.id}" class="${me.pos===b.id?"":"ghost"}">${b.e} ${b.s}</button>`).join("");
 const b=bid(me.pos),here=all.filter(p=>p.online&&p.pos===b.id&&p.id!==me.id);
 $("#panel").innerHTML=`<h2>${b.e} ${b.n}</h2><p style="margin:0 0 8px">${b.d}</p>`+(b.id==="cells"?'<button data-go="cells">Открыть кельи</button> <button class="ghost" data-go="mycell">Моя келья</button>':"")+(b.id==="abbot"&&me.is_admin?'<button data-go="adm">Админ-панель</button>':"")+(here.length?`<p class="mut" style="margin:8px 0 0">Сейчас здесь: ${here.map(p=>esc(p.name)).join(", ")}</p>`:"");
}
$("#t-map").addEventListener("click",e=>{
 const g=e.target.closest("[data-b]"),o=e.target.dataset.go;
 if(g){me.pos=g.dataset.b;rMap();upd(me,{pos:me.pos})}
 else if(o==="mycell"){setTab("cells");viewId=me.id;rCells()}
 else if(o)setTab(o);
});

// ---------- Кельи ----------
function rCells(){
 const el=$("#t-cells"),p=viewId&&all.find(x=>x.id===viewId);
 if(p){
  const own=p.id===me.id;
  el.innerHTML=`<button class="ghost" id="cb">← Все кельи</button><div class="card"><h2>🏠 Келья: ${esc(p.name)} ${dot(p)}</h2><div class="mut">${esc(rn(p))}</div>`+(own?`<textarea id="ct" maxlength="2000" placeholder="Напишите что-нибудь для тех, кто зайдёт в вашу келью…">${esc(p.cell_text)}</textarea><div class="row"><button id="cs">Сохранить</button><span class="mut" id="cm"></span></div>`:`<div class="cell">${esc(p.cell_text||"В келье пока пусто.")}</div><button id="call">🔔 Позвать: ${esc(p.name)}</button><div class="mut" id="cm" style="margin-top:6px"></div>`)+"</div>";
 }else{
  viewId=null;
  el.innerHTML=`<div class="card"><button id="mine">Моя келья</button></div><div class="card"><h2>Кельи обители</h2>`+sorted().map(x=>`<div class="role"><span>${dot(x)}${esc(x.name)} <span class="mut">· ${esc(rn(x))}</span></span><button class="ghost" data-c="${x.id}">Войти</button></div>`).join("")+"</div>";
 }
}
$("#t-cells").addEventListener("click",async e=>{
 const t=e.target;
 if(t.dataset.c){viewId=t.dataset.c;return rCells()}
 if(t.id==="mine"){viewId=me.id;return rCells()}
 if(t.id==="cb"){viewId=null;return rCells()}
 if(t.id==="cs"){const ok=await upd(me,{cell_text:$("#ct").value});$("#cm").textContent=ok?"Сохранено.":"Не удалось сохранить."}
 if(t.id==="call"){
  const now=Date.now(),cm=$("#cm");
  if(now-(lastCall[viewId]||0)<30000){cm.textContent="Вы только что звали. Подождите немного.";return}
  const{error}=await sb.from("notes").insert({to_id:viewId,from_id:me.id,kind:"call",body:""});
  if(!error)lastCall[viewId]=now;
  cm.textContent=error?"Не удалось позвать.":"Вы позвали насельника, ему придёт уведомление.";
 }
});

// ---------- Братия ----------
function rBro(){
 const on=all.filter(p=>p.online).length;
 $("#t-bro").innerHTML=`<div class="card"><h2>Братия и сёстры обители</h2><div class="mut">Сейчас в обители: ${on} из ${all.length}</div>`+sorted().map(p=>`<div class="role"><span>${dot(p)}${esc(p.name)}${p.id===me.id?" (вы)":""}</span><span class="mut">${esc(rn(p))}</span></div>`).join("")+"</div>";
}

// ---------- Письма ----------
function rInbox(){
 const canN="Notification"in window&&Notification.permission==="default";
 $("#t-inbox").innerHTML=(me.task?`<div class="card"><h2>📜 Моё послушание</h2><div class="cell">${esc(me.task)}</div><button id="td">${me.task_done?"Вернуть в работу":"Выполнено ✓"}</button> ${me.task_done?'<span class="mut">отмечено выполненным</span>':""}</div>`:"")
 +`<div class="card"><h2>Письма и уведомления</h2>`+(canN?'<button class="ghost" id="nb">Включить уведомления браузера</button>':"")
 +(notes.some(n=>!n.read)?' <button class="ghost" id="ra">Прочитать все</button>':"")
 +(notes.length?notes.map(n=>`<div class="role" style="${n.read?"opacity:.6":""}"><span>${esc(ntext(n))}<br><span class="mut">${fmt(n.created_at)}</span></span>${n.read?"":`<button class="ghost" data-n="${n.id}">Прочитано</button>`}</div>`).join(""):'<p class="mut">Писем пока нет.</p>')+"</div>";
}
$("#t-inbox").addEventListener("click",async e=>{
 const t=e.target;
 if(t.id==="td")await upd(me,{task_done:!me.task_done});
 else if(t.id==="nb")await Notification.requestPermission();
 else if(t.id==="ra")await sb.from("notes").update({read:true}).eq("to_id",me.id).eq("read",false);
 else if(t.dataset.n)await sb.from("notes").update({read:true}).eq("id",t.dataset.n);
 else return;
 await loadNotes(false);render();
});

// ---------- Админ-панель ----------
function rAdm(){
 $("#t-adm").innerHTML=`<div class="card"><h2>🛡 Админ-панель архиепископа</h2>
 <div class="row"><input id="annin" placeholder="Объявление для братии" maxlength="140"><button id="annb">Опубликовать</button></div>
 <div class="err" id="admmsg"></div></div><div class="card"><h2>Зарегистрированные</h2>`
 +sorted().map(p=>`<div class="u"><div>${dot(p)}<b>${esc(p.name)}</b> <span class="mut">· @${esc(p.login)} · ${esc(rn(p))}${p.task?(p.task_done?" · послушание выполнено ✓":" · есть послушание"):""}</span></div>`
 +(p.is_admin?"":`<div><select data-k="${p.id}">${Object.entries(ROLES).map(([k,r])=>`<option value="${k}"${p.role===k?" selected":""}>${r.join(" / ")}</option>`).join("")}</select></div>
 <div class="row"><input data-t placeholder="Послушание" value="${esc(p.task)}" maxlength="300"><button data-a="task" data-k="${p.id}">Назначить</button></div>
 <div class="row" style="margin-top:6px"><input placeholder="Личное сообщение" maxlength="500"><button class="ghost" data-a="msg" data-k="${p.id}">Отправить</button></div>`)+"</div>").join("")+"</div>";
}
$("#t-adm").addEventListener("click",async e=>{
 const t=e.target,am=()=>$("#admmsg");
 if(!me.is_admin)return;
 if(t.id==="annb"){
  const v=$("#annin").value.trim();
  if(v)await sb.from("settings").upsert({k:"ann",v});else await sb.from("settings").delete().eq("k","ann");
  await loadAll();return render();
 }
 const a=t.dataset.a,k=t.dataset.k;if(!a||!k)return;
 const v=t.parentElement.querySelector("input").value.trim();let error=null;
 if(a==="task"){
  ({error}=await sb.rpc("admin_set_task",{target:k,new_task:v}));
  if(!error&&v)await sb.from("notes").insert({to_id:k,from_id:me.id,kind:"task",body:v});
 }else{
  if(!v)return;
  ({error}=await sb.from("notes").insert({to_id:k,from_id:me.id,kind:"msg",body:v}));
 }
 await loadAll();rAdm();
 am().textContent=error?"Ошибка: "+error.message:(a==="task"?"Послушание назначено.":"Сообщение отправлено.");
});
$("#t-adm").addEventListener("change",async e=>{
 const k=e.target.dataset.k;if(!e.target.matches("select")||!k||!me.is_admin)return;
 const r=e.target.value,{error}=await sb.rpc("admin_set_role",{target:k,new_role:r});
 if(!error)await sb.from("notes").insert({to_id:k,from_id:me.id,kind:"msg",body:"Архиепископ даровал вам чин: "+ROLES[r].join(" / ")});
 await loadAll();rAdm();
 $("#admmsg").textContent=error?"Ошибка: "+error.message:"Чин присвоен.";
});

$("#npb").onclick=async()=>{
 const p=$("#npw").value,m=$("#npm");
 if(p.length<4){m.textContent="От 4 знаков.";return}
 const{error}=await sb.auth.updateUser({password:PW(p)});
 m.textContent=error?"Ошибка: "+error.message:"Пароль изменён.";if(!error)$("#npw").value="";
};
const go=()=>sb&&(authMode==="reg"?reg():login());
$("#go").onclick=go;$("#out").onclick=()=>leave();
$("#p").addEventListener("keydown",e=>{if(e.key==="Enter")go()});
$("#mseg").addEventListener("click",e=>{
 const m=e.target.dataset.m;if(!m)return;
 authMode=m;msg("");
 $("#regf").classList.toggle("hide",m!=="reg");
 [...$("#mseg").children].forEach(b=>b.classList.toggle("on",b.dataset.m===m));
 $("#go").textContent=m==="reg"?"Принять в обитель":"Войти в обитель";
 $("#hint").textContent=m==="reg"?"Каждый новый насельник начинает путь послушником или послушницей. Чины даёт архиепископ.":"Нет аккаунта? Откройте вкладку «Регистрация».";
});
$("#gseg").addEventListener("click",e=>{
 const g=e.target.dataset.g;if(!g)return;
 gsel=g;[...$("#gseg").children].forEach(b=>b.classList.toggle("on",b.dataset.g===g));
});

if(typeof supabase==="undefined"){msg("Не удалось загрузить библиотеку Supabase. Проверьте интернет.")}
else{
 sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 sb.auth.getSession().then(({data})=>{if(data.session)boot(data.session.user)});
}
</script>
</body>
</html>
